name: 'olist_warehouse'

config-version: 2
version: '1.0.0'

profile: 'warehouse'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analysis"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
    - "target"
    - "dbt_packages"
    - "logs"

require-dbt-version: [">=1.0.0", "<2.0.0"]

models:
  olist_warehouse:
    +schema: "{{ target.schema }}"

    staging:
      +materialized: view
      
    marts:
      +materialized: table