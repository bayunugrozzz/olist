version: 2

models:
  - name: dim_customers
    description: "Tabel dimensi pelanggan (Current State)."
    columns:
      - name: customer_key
        description: "Primary key / Surrogate key pelanggan."
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: dim_products
    description: "Tabel dimensi produk dengan penerjemahan Bahasa Inggris dan kalkulasi volume."
    columns:
      - name: product_key
        description: "Primary key / Surrogate key produk."
        data_tests:
          - unique
          - not_null
      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: dim_sellers
    description: "Tabel dimensi penjual/mitra (Current State)."
    columns:
      - name: seller_key
        description: "Primary key / Surrogate key seller."
        data_tests:
          - unique
          - not_null
      - name: seller_id
        data_tests:
          - unique
          - not_null

  - name: dim_marketing_leads
    description: "Tabel dimensi prospek pemasaran (MQL) dan status akuisisi seller."
    columns:
      - name: mql_key
        description: "Primary key / Surrogate key MQL."
        data_tests:
          - unique
          - not_null
      - name: mql_id
        data_tests:
          - unique
          - not_null